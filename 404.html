    <meta charset="UTF-8" />
    <title>IB Technicals</title>
    <script>
      // GitHub Pages has no server rewrites. We use a hash router, so any non-root
      // path is a stray link — send it back to the app root.
      location.replace('/' + (location.hash || ''));
    </script>
  </head>
